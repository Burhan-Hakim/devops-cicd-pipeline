<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Abode Software – DevOps Pipeline</text>

  <!-- Developer -->
  <rect x="40" y="80" width="150" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">Developer</text>
  <text x="115" y="123" text-anchor="middle" font-size="12" fill="#4b5563">git push</text>

  <!-- GitHub -->
  <rect x="260" y="80" width="170" height="60" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="345" y="105" text-anchor="middle" font-size="14" fill="#111827" font-weight="600">GitHub repo</text>
  <text x="345" y="123" text-anchor="middle" font-size="12" fill="#4b5563">master / develop</text>

  <line x1="190" y1="110" x2="258" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Webhook -->
  <rect x="500" y="80" width="170" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="585" y="105" text-anchor="middle" font-size="14" fill="#78350f" font-weight="600">Webhook</text>
  <text x="585" y="123" text-anchor="middle" font-size="12" fill="#92400e">on push event</text>

  <line x1="430" y1="110" x2="498" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Jenkins master box -->
  <rect x="380" y="200" width="290" height="130" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="525" y="225" text-anchor="middle" font-size="15" fill="#0c4a6e" font-weight="700">Jenkins Master</text>
  <text x="525" y="243" text-anchor="middle" font-size="11" fill="#0c4a6e">Multibranch Pipeline</text>

  <rect x="400" y="255" width="250" height="55" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  <text x="525" y="277" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="600">Job1 · Build</text>
  <text x="525" y="295" text-anchor="middle" font-size="11" fill="#075985">docker build + push image</text>

  <line x1="585" y1="140" x2="585" y2="198" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="172" font-size="11" fill="#6b7280">triggers build</text>

  <!-- Docker Hub -->
  <rect x="760" y="80" width="180" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="850" y="105" text-anchor="middle" font-size="14" fill="#312e81" font-weight="600">Docker Hub</text>
  <text x="850" y="123" text-anchor="middle" font-size="12" fill="#4338ca">abode-website</text>

  <line x1="650" y1="260" x2="850" y2="260" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="850" y1="260" x2="850" y2="142" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="855" y="200" font-size="11" fill="#6b7280">push image</text>

  <!-- Test agent -->
  <rect x="80" y="420" width="260" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="210" y="446" text-anchor="middle" font-size="15" fill="#14532d" font-weight="700">test-slave agent</text>
  <text x="210" y="464" text-anchor="middle" font-size="11" fill="#166534">label: test</text>

  <rect x="100" y="476" width="220" height="55" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="210" y="498" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">Job2 · Test</text>
  <text x="210" y="516" text-anchor="middle" font-size="11" fill="#166534">pull image, run, curl check</text>

  <text x="210" y="555" text-anchor="middle" font-size="11" fill="#166534">runs on every push (develop or master)</text>

  <!-- Prod agent -->
  <rect x="660" y="420" width="260" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="790" y="446" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="700">prod-slave agent</text>
  <text x="790" y="464" text-anchor="middle" font-size="11" fill="#991b1b">label: prod</text>

  <rect x="680" y="476" width="220" height="55" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="790" y="498" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600">Job3 · Prod</text>
  <text x="790" y="516" text-anchor="middle" font-size="11" fill="#991b1b">deploy on port 80</text>

  <text x="790" y="555" text-anchor="middle" font-size="11" fill="#991b1b">runs only when branch = master</text>

  <!-- Lines from master to agents -->
  <line x1="440" y1="310" x2="230" y2="418" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="310" x2="790" y2="418" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End users -->
  <rect x="40" y="600" width="0" height="0"/>

  <!-- Legend -->
  <text x="40" y="600" font-size="11" fill="#6b7280">Ansible provisions all three EC2 servers (Git, Docker, Java, Jenkins) before the pipeline runs.</text>
</svg>
